<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ro' }}">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
</head>

<body>
  <a class="skip-link" href="#main">Sari la conținut</a>

  {% include nav.html %}

  <main id="main">
    {{ content }}
  </main>

  {% include footer.html %}
  {% include whatsapp.html %}

  <script>
    (function () {
      var nav = document.getElementById('nav');
      var onScroll = function () { nav.classList.toggle('scrolled', window.scrollY > 8) };
      window.addEventListener('scroll', onScroll, { passive: true }); onScroll();

      var menu = document.getElementById('mobileMenu');
      var openBtn = document.getElementById('menuOpen');
      var closeBtn = document.getElementById('menuClose');
      function open() { menu.classList.add('open'); openBtn.setAttribute('aria-expanded', 'true'); document.body.style.overflow = 'hidden'; }
      function close() { menu.classList.remove('open'); openBtn.setAttribute('aria-expanded', 'false'); document.body.style.overflow = ''; }
      openBtn.addEventListener('click', open);
      closeBtn.addEventListener('click', close);
      menu.querySelectorAll('[data-close]').forEach(function (el) { el.addEventListener('click', close); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

      var y = document.getElementById('year'); if (y) y.textContent = new Date().getFullYear();
    })();
  </script>
</body>

</html>
