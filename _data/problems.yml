- text: "Cu zile înainte de interviu te apucă anxietatea: îți repeți răspunsuri în minte și tot simți că \"o să te blochezi\"."
- text: "La interviu, emoțiile îți umbresc competența și nu reușești să transmiți valoarea ta reală."
- text: "CV-ul tău nu spune ce caută angajatorul. E respins înainte să fie citit cu adevărat de un om."
- text: "Profilul tău de LinkedIn nu te ajută: recrutorii trec pe lângă el în loc să te caute pe tine."
- text: "Candidatura ta se pierde în masa celor 200 de aplicanți și nu primești niciun răspuns."
- text: "Timpul trece, încrederea în sine scade și cariera ta stagnează fără un motiv clar."
